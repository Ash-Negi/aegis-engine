spring:
  application:
    name: aegis-execution-engine

  # Virtual threads for request handling — signal processing is I/O-bound
  # (Postgres, broker), which is exactly what they are for.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:aegis}

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` makes Hibernate check that the
      # entities match the migrated tables and fail fast if they drifted,
      # rather than silently altering a table that holds an audit trail.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

aegis:
  signal:
    channel: aegis:signals
    latest-key: aegis:signals:latest
    schema-version: 1

  broker:
    mode: mock
    reject-probability: 0.0
    partial-fill-probability: 0.4
    seed: 42

  account:
    starting-cash: 100000
    prices:
      QQQ: 485.20
      GLDM: 62.40
      FBTC: 88.15
      VXUS: 71.30

logging:
  level:
    com.aegis.execution: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
