# H2 in PostgreSQL compatibility mode, so the real Flyway migration runs
# against it. Testing with an in-memory database that speaks a different
# dialect would let a broken migration reach production green.
spring:
  datasource:
    url: jdbc:h2:mem:aegis;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

aegis:
  signal:
    schema-version: 1
  broker:
    mode: mock
  account:
    starting-cash: 100000
    prices:
      QQQ: 100
      GLDM: 50
      VXUS: 25

  risk:
    max-position-weight: 0.60
    max-drawdown-pct: 0.20

logging:
  level:
    com.aegis.execution: DEBUG

# No Redis in the unit suite. The subscription is switched off rather than
# mocked — the intake path is tested by calling ExecutionService directly.
aegis.signal.subscribe-enabled: false
